<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E293B" />
    <link rel="canonical" href="https://printcaju.vercel.app/" />
    <!-- SEO -->
    <title>Print Caju | Impressão 3D e Produtos Personalizados</title>
    <meta
      name="description"
      content="Print Caju: produtos criativos, impressão 3D e peças personalizadas. Transformamos ideias em produtos especiais."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Print Caju" />
    <meta
      name="keywords"
      content="Print Caju, impressão 3D, produtos 3D, peças personalizadas, presentes personalizados, decoração 3D"
    />

    <!-- Dados Estruturados (Define o Nome do Site no Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Print Caju",
        "alternateName": ["PrintCaju"],
        "url": "https://printcaju.vercel.app/"
      }
    </script>

    <!-- Open Graph: compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Print Caju" />
    <meta property="og:url" content="https://printcaju.vercel.app/" />
    <meta property="og:title" content="Print Caju | Ideias que ganham forma" />
    <meta
      property="og:description"
      content="Conheça nossos produtos criativos e soluções em impressão 3D."
    />

    <!-- Favicon e PWA -->
    <link rel="icon" type="image/png" sizes="96x96" href="/printcaju-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;background:#fffaf2;color:#292638;font-family:Arial,sans-serif;text-align:center">
        <img
          src="/printcaju-logo.png"
          alt="Print Caju"
          style="width:150px;max-height:58px;object-fit:contain"
        />
        <strong style="font-family:Georgia,serif;font-size:34px;font-weight:500">
          Ideias que ganham forma.
        </strong>
        <span style="color:#726f7d;font-size:14px">
          Preparando nossos produtos e novidades…
        </span>
      </main>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
